<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      name="description"
      content="Watch movies and TV series on ULMFlix."
    />

    <title>Watch - ULMFlix</title>

    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="nav scrolled" data-site-nav></nav>

    <!-- =========================
         WATCH PAGE
    ========================== -->

    <main class="watch-page" style="padding-top: 90px">
      <!-- =========================
             VIDEO PLAYER
        ========================== -->

      <section class="watch-player-section">
        <div class="video" id="watchPlayerContainer">
          <video
            id="watchVideo"
            controls
            playsinline
            preload="metadata"
          ></video>

          <!-- Loading -->

          <div
            id="watchLoading"
            class="status"
            role="status"
            aria-live="polite"
          >
            Loading video...
          </div>

          <!-- Error -->

          <div
            id="watchError"
            class="status"
            role="alert"
            style="display: none"
          ></div>
        </div>

        <!-- =========================
                 PLAYER CONTROLS
            ========================== -->

        <div
          class="watch-controls"
          style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px"
        >
          <button class="btn btn-dark" id="skipIntro" type="button">
            ⏩ Skip Intro
          </button>

          <button class="btn btn-dark" id="previousEpisode" type="button">
            ← Previous
          </button>

          <button class="btn btn-dark" id="nextEpisode" type="button">
            Next Episode →
          </button>

          <button class="btn btn-dark" id="addToMyList" type="button">
            ＋ My List
          </button>

          <button class="btn btn-dark" id="shareWatch" type="button">
            Share
          </button>
        </div>
      </section>

      <!-- =========================
             CONTENT INFORMATION
        ========================== -->

      <section class="watch-info container" style="padding-top: 25px">
        <div class="watch-header">
          <h1 id="watchTitle">Loading...</h1>

          <p id="watchMeta" class="muted">Loading information...</p>
        </div>

        <p id="watchDescription" class="watch-description">
          Please wait while the content information is loading.
        </p>

        <!-- =========================
                 GENRES
            ========================== -->

        <div id="watchGenres" class="watch-genres"></div>

        <!-- =========================
                 CONTENT ACTIONS
            ========================== -->

        <div
          class="watch-actions"
          style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px"
        >
          <button class="btn btn-red" id="watchNowButton" type="button">
            ▶ Play
          </button>

          <button class="btn btn-dark" id="favoriteButton" type="button">
            ♡ Add to My List
          </button>
        </div>
      </section>

      <!-- =========================
             EPISODES
        ========================== -->

      <section
        id="episodesSection"
        class="container"
        style="padding-top: 30px; display: none"
      >
        <h2>Episodes</h2>

        <div id="episodeList" class="episode-list"></div>
      </section>

      <!-- =========================
             RELATED CONTENT
        ========================== -->

      <section class="container" style="padding-top: 35px">
        <h2>You May Also Like</h2>

        <div id="relatedGrid" class="grid"></div>
      </section>
    </main>

    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/supabase-client.js"></script><script src="js/auth.js"></script><script src="js/catalog.js"></script><script src="js/library.js"></script>
    <script src="js/navbar.js"></script>

    <script src="js/app.js"></script>

    <script src="js/player.js"></script>

    <script src="js/player-plus.js"></script>

    <script src="js/watch.js"></script>
  </body>
</html>
