<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password - ULMFlix</title><link rel="stylesheet" href="css/main.css"></head><body>
<nav class="nav scrolled" data-site-nav></nav><main class="form"><a class="logo" href="index.html">ULMFLIX</a>
<section id="requestPanel"><h2>Reset your password</h2><p class="muted">Enter your account email and we'll send a reset link.</p><form id="forgotPasswordForm"><input id="resetEmail" type="email" autocomplete="email" placeholder="Email" required><button class="btn btn-red" type="submit">Send Reset Link</button></form></section>
<section id="updatePanel" hidden><h2>Choose a new password</h2><form id="updatePasswordForm"><input id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="New password" required><input id="newPasswordConfirm" type="password" minlength="8" autocomplete="new-password" placeholder="Confirm password" required><button class="btn btn-red" type="submit">Update Password</button></form></section>
<p id="authMessage" class="muted" role="status" aria-live="polite"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-config.js"></script><script src="js/supabase-client.js"></script><script src="js/auth.js"></script><script src="js/navbar.js"></script>
<script>document.addEventListener('DOMContentLoaded',async()=>{const hasRecovery=location.hash.includes('access_token=')||location.search.includes('code=');if(hasRecovery){document.getElementById('requestPanel').hidden=true;document.getElementById('updatePanel').hidden=false;try{if(location.search.includes('code=')&&window.SF_SUPABASE){await window.SF_SUPABASE.auth.exchangeCodeForSession(location.search)} }catch(e){document.getElementById('authMessage').textContent=e.message}}});</script></body></html>
