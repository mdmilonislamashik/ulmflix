<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ad Placement Control | ULMFlix Admin</title><link rel="stylesheet" href="css/admin.css"></head><body><main class="content" style="max-width:1200px;margin:auto"><div class="topbar"><div><div class="admin-kicker">Monetization</div><h1>Ad Placement Control</h1><p>Configure which public placements are enabled.</p></div><div class="actions"><a href="index.html" class="btn btn-dark">Admin Home</a></div></div><section class="panel"><h2>Placements</h2><div id="list"></div><button class="btn btn-red" id="save" style="margin-top:14px">Save Placements</button><div id="msg" class="note" style="display:none"></div></section><section class="panel"><h2>AdSense</h2><p class="note">Add your approved publisher ID to <code>js/config.js</code>. Never paste secret credentials into frontend code.</p></section></main><script>const K='sf_ad_placements';const defaults=[['home_top','Home top'],['home_inline','Home inline'],['movie_list','Movie list'],['details','Movie details'],['guides','Guides']];const read=()=>{try{return JSON.parse(localStorage.getItem(K)||'null')||Object.fromEntries(defaults.map(x=>[x[0],true]))}catch{return Object.fromEntries(defaults.map(x=>[x[0],true]))}};function render(){const v=read();document.querySelector('#list').innerHTML=defaults.map(([id,label])=>`<label style="display:flex;gap:10px;align-items:center;margin:12px 0"><input type="checkbox" data-id="${id}" ${v[id]?'checked':''}> ${label}</label>`).join('')}document.addEventListener('DOMContentLoaded',()=>{render();document.querySelector('#save').onclick=()=>{const v={};document.querySelectorAll('[data-id]').forEach(x=>v[x.dataset.id]=x.checked);localStorage.setItem(K,JSON.stringify(v));document.querySelector('#msg').style.display='block';document.querySelector('#msg').textContent='Ad placement settings saved.'}})</script><script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/supabase-client.js"></script><script src="js/admin-auth.js"></script></body></html>
