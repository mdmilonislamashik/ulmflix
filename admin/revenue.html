<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revenue Dashboard | ULMFlix Admin</title><link rel="stylesheet" href="css/admin.css"></head><body><main class="content" style="max-width:1200px;margin:auto"><div class="topbar"><div><div class="admin-kicker">Business Intelligence</div><h1>Revenue Dashboard</h1><p>Track premium, ads and other revenue streams.</p></div><div class="actions"><a href="index.html" class="btn btn-dark">Admin Home</a></div></div><section class="stats"><div class="stat"><span class="label">Gross Revenue</span><strong id="gross">$0.00</strong><small>Recorded locally</small></div><div class="stat"><span class="label">Subscriptions</span><strong id="subs">$0.00</strong><small>Premium</small></div><div class="stat"><span class="label">Ad Revenue</span><strong id="ads">$0.00</strong><small>Ad network reports</small></div><div class="stat"><span class="label">Other</span><strong id="other">$0.00</strong><small>Affiliate / sponsors</small></div></section><section class="panel"><h2>Add revenue event</h2><div class="form-grid"><input id="amount" type="number" step="0.01" placeholder="Amount"><select id="type"><option value="subscription">Subscription</option><option value="ads">Ads</option><option value="affiliate">Affiliate</option><option value="sponsor">Sponsor</option><option value="other">Other</option></select><input id="note" placeholder="Note"></div><button class="btn btn-red" id="add" style="margin-top:12px">Record Revenue</button></section><section class="panel"><h2>Recent events</h2><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Note</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>const K='sf_revenue_events';const read=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}};const money=n=>'$'+Number(n||0).toFixed(2);function render(){const a=read();let t=0,s=0,ad=0,o=0;a.forEach(x=>{const n=Number(x.amount)||0;t+=n;if(x.type==='subscription')s+=n;else if(x.type==='ads')ad+=n;else o+=n});document.querySelector('#gross').textContent=money(t);document.querySelector('#subs').textContent=money(s);document.querySelector('#ads').textContent=money(ad);document.querySelector('#other').textContent=money(o);document.querySelector('#rows').innerHTML=a.slice().reverse().map(x=>`<tr><td>${new Date(x.date).toLocaleString()}</td><td>${x.type}</td><td>${money(x.amount)}</td><td>${String(x.note||'').replace(/[<>]/g,'')}</td></tr>`).join('')||'<tr><td colspan="4">No revenue events.</td></tr>'}document.addEventListener('DOMContentLoaded',()=>{render();document.querySelector('#add').onclick=()=>{const amount=Number(document.querySelector('#amount').value);if(!(amount>0))return;const a=read();a.push({amount,type:document.querySelector('#type').value,note:document.querySelector('#note').value,date:new Date().toISOString()});localStorage.setItem(K,JSON.stringify(a));render()}})</script><script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/supabase-client.js"></script><script src="js/admin-auth.js"></script></body></html>
