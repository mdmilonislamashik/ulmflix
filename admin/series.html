<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Series Management • ULMFlix Admin</title><link rel="stylesheet" href="css/admin.css"><style>.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.list{display:grid;gap:10px}.item{padding:14px;border:1px solid #292c32;border-radius:10px;background:#15171a;display:flex;justify-content:space-between;gap:12px}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.item{flex-direction:column}}</style></head><body><nav class="admin-nav"><button class="menu-btn" id="menuBtn">☰</button><a href="index.html" class="logo"><span>ULMFLIX</span> ADMIN</a><div class="nav-right"><a href="../index.html" class="btn btn-dark">↗ View Website</a></div></nav><aside class="sidebar" id="sidebar"><div class="side-title">Content</div><a class="side-link" href="index.html">▦ Dashboard</a><a class="side-link" href="movies.html">🎬 Movies</a><a class="side-link active" href="series.html">📺 Series</a><div class="side-title">Management</div><a class="side-link" href="users.html">👥 Users</a><a class="side-link" href="settings.html">⚙ Settings</a></aside><main class="main"><div class="topbar"><div><h1>Series Management</h1><p>Create series, seasons and episodes with Supabase.</p></div></div><section class="panel"><h2>New Series</h2><form id="seriesForm" class="form-grid"><input class="input" id="title" placeholder="Series title" required><input class="input" id="year" type="number" placeholder="Release year"><input class="input full" id="description" placeholder="Description"><input class="input" id="poster" placeholder="Poster URL"><select class="select" id="status"><option>Published</option><option>Draft</option><option>Hidden</option></select><button class="btn btn-red full">Create Series</button></form></section><section class="panel"><h2>Series</h2><div id="seriesList" class="list"></div></section><section class="panel"><h2>Add Episode</h2><form id="episodeForm" class="form-grid"><select class="select" id="seriesId" required></select><input class="input" id="seasonNumber" type="number" min="1" value="1" placeholder="Season"><input class="input" id="episodeNumber" type="number" min="1" value="1" placeholder="Episode"><input class="input" id="episodeTitle" placeholder="Episode title" required><input class="input full" id="episodeDescription" placeholder="Episode description"><input class="input" id="episodeVideo" placeholder="Legal video URL"><select class="select" id="episodeStatus"><option>Published</option><option>Draft</option><option>Hidden</option></select><button class="btn btn-red full">Add Episode</button></form></section></main><script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/supabase-client.js"></script><script src="js/admin-auth.js"></script><script src="js/admin.js"></script><script>
(async()=>{const db=window.SF_SUPABASE,$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function load(){const {data}=await db.from('series').select('*').order('added_at',{ascending:false});$('seriesList').innerHTML=(data||[]).map(s=>`<div class="item"><div><b>${esc(s.title)}</b><div class="muted">${esc(s.release_year||'')} • ${esc(s.status)}</div></div><button class="btn btn-danger" data-del="${s.id}">Delete</button></div>`).join('')||'<div class="status">No series yet.</div>';$('seriesId').innerHTML=(data||[]).map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('');}document.addEventListener('click',async e=>{const b=e.target.closest('[data-del]');if(b&&confirm('Delete this series and its episodes?')){await db.from('series').delete().eq('id',b.dataset.del);load()}});$('seriesForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.from('series').insert({title:$('title').value.trim(),release_year:Number($('year').value)||null,description:$('description').value.trim(),poster_url:$('poster').value.trim(),status:$('status').value});if(error)alert(error.message);else{e.target.reset();load()}};$('episodeForm').onsubmit=async e=>{e.preventDefault();const seriesId=Number($('seriesId').value),seasonNumber=Number($('seasonNumber').value)||1;let {data:season}=await db.from('seasons').select('*').eq('series_id',seriesId).eq('season_number',seasonNumber).maybeSingle();if(!season){const r=await db.from('seasons').insert({series_id:seriesId,season_number:seasonNumber,title:`Season ${seasonNumber}`}).select().single();if(r.error)return alert(r.error.message);season=r.data}const {error}=await db.from('episodes').insert({series_id:seriesId,season_id:season.id,episode_number:Number($('episodeNumber').value)||1,title:$('episodeTitle').value.trim(),description:$('episodeDescription').value.trim(),video_url:$('episodeVideo').value.trim(),status:$('episodeStatus').value});if(error)alert(error.message);else{e.target.reset();load()}};load()})();</script></body></html>
